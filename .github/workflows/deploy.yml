name: Deploy to VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy on VM
        run: |
          cd ~/stock_option_pj
          git pull origin main
          .venv/bin/pip install -r requirements.txt -q
          sudo systemctl restart stock-analyzer
          echo "Deploy complete"
