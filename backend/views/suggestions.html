<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>건의사항</title>
<script>function applyTheme(t){ if(t==='light'||t==='warm') document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; }
try{ applyTheme(localStorage.getItem('theme')); }catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 테마 (2026-10-11): 다크(기본) · 화이트 · 웜 — html[data-theme]. 상태색(좋음 초록 #2ea043 · 나쁨 빨강 #da3633)은 셋 다 같음 */
:root{color-scheme:dark;
  --bg:#0d1117;--c1:#161b22;--c1b:#11161d;--c2:#1c2128;--c2b:#1c2330;--c2c:#1d2633;--c3:#21262d;--c4:#253041;--sunk:#0f141b;
  --ln:#30363d;--ln2:#262c36;--ln3:#3d4a5c;--ln4:#1f252e;--ln5:#5b6a7e;--tx:#e6edf3;--strong:#ffffff;--bd:#c9d1d9;--bd2:#adbac7;--bd3:#d3dae3;
  --mu:#8b949e;--mu3:#8a96a6;--mu2:#6e7681;--fa:#484f58;--r:#f85149;--b:#58a6ff;--g:#3fb950;--y:#d29922;--y2:#e3b341;--o:#f0883e;--p:#bc8cff;--p2:#d2a8ff;
  --r2:#ff7b72;--g2:#7ee787;--r3:#ffa198;--sun:#f47067;--sat:#6cb6ff;--krt:#f0a5ad;--krb:#6e4048;--rbg:#3d0b0b;--holb:#3a2226;--holbg:#1a1214;--yb:#9e6a03;
  --up2:#f2555a;--dn2:#5b8def;--neu:#e8edf3;--neu-on:#0f141b;--bcard:#161d27;--bline2:#202a38;--hdr:#0f141b;--shadow:rgba(0,0,0,.35)}
:root[data-theme=light]{color-scheme:light;
  --bg:#f4f6f9;--c1:#ffffff;--c1b:#ffffff;--c2:#f1f3f6;--c2b:#eef1f5;--c2c:#edf0f4;--c3:#e7ebf0;--c4:#dfe4ea;--sunk:#f5f7fa;
  --ln:#d0d7de;--ln2:#dfe3e8;--ln3:#b6c0cc;--ln4:#e6e9ed;--ln5:#8c96a3;--tx:#1f2328;--strong:#0d1117;--bd:#2f353c;--bd2:#454d56;--bd3:#2f353c;
  --mu:#5f6873;--mu3:#5f6873;--mu2:#8c959f;--fa:#b0b8c1;--r:#cf222e;--b:#0969da;--g:#1a7f37;--y:#9a6700;--y2:#9a6700;--o:#bc4c00;--p:#8250df;--p2:#8250df;
  --r2:#cf222e;--g2:#1a7f37;--r3:#cf222e;--sun:#cf222e;--sat:#0969da;--krt:#b42318;--krb:#e7b3b6;--rbg:#ffebe9;--holb:#f2c9c9;--holbg:#fff4f3;--yb:#d4a72c;
  --up2:#d1242f;--dn2:#0b5cd5;--neu:#24292f;--neu-on:#ffffff;--bcard:#ffffff;--bline2:#e8ecf0;--hdr:#ffffff;--shadow:rgba(31,35,40,.10)}
:root[data-theme=warm]{color-scheme:light;
  --bg:#f1eadb;--c1:#fbf7ef;--c1b:#fbf7ef;--c2:#f2eadb;--c2b:#efe6d4;--c2c:#ece2ce;--c3:#e9dfca;--c4:#e0d4bc;--sunk:#f6f0e4;
  --ln:#d8cab0;--ln2:#e4d9c4;--ln3:#c3b294;--ln4:#e8dfcc;--ln5:#a08f74;--tx:#2e261d;--strong:#1f1810;--bd:#43392e;--bd2:#584c3e;--bd3:#43392e;
  --mu:#776855;--mu3:#776855;--mu2:#9a8a74;--fa:#bcae96;--r:#c0392b;--b:#2c5fa8;--g:#3a7d2c;--y:#8a6100;--y2:#8a6100;--o:#a3480f;--p:#7b4fbf;--p2:#7b4fbf;
  --r2:#c0392b;--g2:#3a7d2c;--r3:#c0392b;--sun:#c0392b;--sat:#2c5fa8;--krt:#a8321f;--krb:#e0b5a6;--rbg:#f8e2da;--holb:#e6c3b4;--holbg:#f8ebe3;--yb:#c9a24a;
  --up2:#c4302b;--dn2:#2c5fa8;--neu:#3a3027;--neu-on:#fbf7ef;--bcard:#fbf7ef;--bline2:#ebe1cf;--hdr:#fbf7ef;--shadow:rgba(60,45,25,.10)}
:root{--gbg:rgba(35,134,54,.14)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--bd);font:14px/1.6 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px 24px}h1{font-size:24px;margin:0 0 4px}.sub,.muted{color:var(--mu)}.box{background:var(--c1);border:0;border-radius:16px;padding:18px 20px;margin-top:16px}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:inherit}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #1f6feb;border-color:#1f6feb}
button{background:#1f6feb;color:#fff;border:0;border-radius:7px;padding:9px 16px;cursor:pointer;font:inherit}button.ghost{background:transparent;color:var(--b);border:1px solid var(--ln);padding:5px 10px;font-size:13px}button.danger{color:var(--r)}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}.row .grow{flex:1}.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}.bar button{background:transparent;color:var(--bd);border:1px solid var(--ln);padding:6px 12px}.bar button.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
.item{border-top:1px solid var(--ln2);padding:14px 0}.item:first-child{border-top:0}.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mu)}.content{white-space:pre-wrap;margin:6px 0 0;color:var(--tx)}
.st{font-size:12px;padding:2px 9px;border-radius:12px;border:1px solid}.st-접수{color:var(--b);border-color:#1f6feb}.st-진행{color:var(--y);border-color:var(--yb)}.st-완료{color:var(--g);border-color:#238636}.st-보류{color:var(--mu);border-color:var(--fa)}
.paste-zone{border:1.5px dashed var(--ln);border-radius:8px;padding:10px;margin-top:10px;font-size:12.5px;color:var(--mu);text-align:center;cursor:pointer}
.previews{display:flex;flex-wrap:wrap;gap:10px}.preview{position:relative;margin-top:8px}.preview img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--ln);display:block}
.preview .rm{position:absolute;top:-8px;right:-8px;background:var(--r);color:#fff;border:0;border-radius:50%;width:22px;height:22px;line-height:22px;padding:0;font-size:13px}
.shots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.shots img{width:140px;height:140px;object-fit:cover;border-radius:8px;border:1px solid var(--ln);cursor:zoom-in}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;align-items:center;justify-content:center;cursor:zoom-out}.lightbox.show{display:flex}.lightbox img{max-width:92vw;max-height:92vh;border-radius:6px}
.cmts{margin-top:8px;padding-left:12px;border-left:2px solid var(--ln)}.cmt{font-size:13px;padding:4px 0}.cmt .who{color:var(--b);font-weight:600;margin-right:6px}.cmt .t{color:var(--mu);font-size:11.5px;margin-left:6px}.cmt .x{background:none;border:0;color:var(--mu);padding:0 4px;font-size:12px}
.cform{display:flex;gap:6px;margin-top:6px}.cform input{width:110px;padding:6px 8px;font-size:13px}.cform textarea{min-height:36px;height:36px;padding:6px 8px;font-size:13px;flex:1}.cform button{padding:6px 12px;font-size:13px}
.reply{margin-top:8px;padding:10px 12px;border-left:3px solid #238636;background:var(--gbg);border-radius:6px;white-space:pre-wrap}.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tools select{width:auto;padding:5px 8px;font-size:13px}.edit{margin-top:8px}.empty{text-align:center;color:var(--mu);padding:24px}.err{color:var(--r);font-size:13px}
</style></head><body><main>
<h1>건의사항</h1><div class="sub">원하는 기능이나 불편한 점을 남겨 주세요. 처리 상황과 답변이 여기에 표시됩니다.</div>
<section class="box">
  <label for="content" class="muted">내용</label>
  <textarea id="content" maxlength="2000" placeholder="예: 차트 후보에 거래량 급증 종목도 같이 보여 주세요 (사진은 Ctrl+V로 붙여넣기 가능)"></textarea>
  <div class="paste-zone" id="paste-zone">📷 여기 눌러서 사진 추가 (최대 5장)</div>
  <div id="previews" class="previews"></div>
  <div class="row"><input id="author" class="grow" maxlength="40" placeholder="이름 (선택)" aria-label="이름"><button id="submit">남기기</button></div>
  <div id="form-msg" class="err" role="status"></div>
</section>
<div class="bar" id="filter"><button data-v="" class="on">전체</button><button data-v="접수">접수</button><button data-v="진행 중">진행 중</button><button data-v="완료">완료</button><button data-v="보류">보류</button></div>
<section class="box" id="list"><div class="empty">불러오는 중…</div></section>
</main>
<input type="file" id="file-picker" accept="image/*" multiple style="display:none">
<div class="lightbox" id="lightbox"><img id="lightbox-img" src="" alt=""></div>
<script>
const API='__API_PREFIX__/suggestions';const STATUS=['접수','진행 중','완료','보류'];let all=[],filter='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=t=>new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
async function call(method,url,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok){let m='요청에 실패했습니다.';try{m=(await r.json()).detail||m}catch(e){}throw Error(typeof m==='string'?m:'입력값을 확인해 주세요.')}return r.json()}
function render(){const box=document.getElementById('list');const rows=all.filter(x=>!filter||x.status===filter);
if(!rows.length){box.innerHTML='<div class="empty">'+(all.length?'이 상태의 건의가 없습니다.':'아직 건의가 없습니다. 첫 건의를 남겨 주세요.')+'</div>';return}
box.innerHTML=rows.map(x=>`<div class="item" data-id="${x.id}"><div class="meta"><span class="st st-${x.status.split(' ')[0]}">${esc(x.status)}</span><span>#${x.id}</span><span>${x.author?esc(x.author)+' · ':''}${when(x.created_at)}</span></div>
<p class="content">${esc(x.content)}</p>${(x.images||[]).length?`<div class="shots">${x.images.map(u=>`<img src="${u}" alt="첨부 사진">`).join('')}</div>`:''}${x.reply?`<div class="reply"><b>답변</b><br>${esc(x.reply)}</div>`:''}
<div class="cmts">${(x.comments||[]).map(c=>`<div class="cmt"><span class="who">${esc(c.author||'이름 없음')}</span>${esc(c.content)}<span class="t">${when(c.created_at)}</span><button class="x" data-act="cdel" data-cid="${c.id}" title="답글 삭제">✕</button></div>`).join('')}
<div class="cform"><input data-f="cauthor" maxlength="40" placeholder="이름" value="${esc(myName())}"><textarea data-f="ccontent" maxlength="1000" placeholder="답글 달기"></textarea><button data-act="cadd">답글</button></div></div>
<div class="tools"><select aria-label="상태 변경" data-act="status">${STATUS.map(s=>`<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select><button class="ghost" data-act="reply">${x.reply?'답변 수정':'답변 달기'}</button><button class="ghost danger" data-act="del">삭제</button></div></div>`).join('')}
// 답글 이름은 종목토론에서 고른 이름(같은 사이트 저장값)을 기본으로
function myName(){try{return localStorage.getItem('sug-author')||localStorage.getItem('disc-author')||''}catch(e){return''}}
let cposting=false;
async function load(){try{all=await call('GET',API);render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">목록을 불러오지 못했습니다.</div>'}}
document.getElementById('submit').onclick=async()=>{const msg=document.getElementById('form-msg');const content=document.getElementById('content').value.trim();if(!content){msg.textContent='내용을 입력해 주세요.';return}
try{await call('POST',API,{content,author:document.getElementById('author').value.trim(),images});document.getElementById('content').value='';images=[];renderPrev();msg.textContent='';await load()}catch(e){msg.textContent=e.message}};
// 사진: 큰 이미지는 가로 1280px·JPEG 80%로 줄여서 저장
let images=[];
function resizeImage(file){return new Promise((resolve,reject)=>{const img=new Image(),rd=new FileReader();rd.onload=()=>{img.onload=()=>{const k=Math.min(1,1280/img.width),w=Math.round(img.width*k),h=Math.round(img.height*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',0.8))};img.onerror=reject;img.src=rd.result};rd.onerror=reject;rd.readAsDataURL(file)})}
function renderPrev(){const a=document.getElementById('previews');a.innerHTML=images.map((u,i)=>`<div class="preview"><img src="${u}" alt=""><button type="button" class="rm" data-i="${i}">✕</button></div>`).join('');a.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{images.splice(Number(b.dataset.i),1);renderPrev()})}
async function addFiles(files){const list=[...files].filter(f=>f&&f.type&&f.type.startsWith('image/'));for(const f of list){if(images.length>=5){document.getElementById('form-msg').textContent='사진은 최대 5장까지입니다.';break}try{images.push(await resizeImage(f))}catch(e){}}renderPrev()}
const picker=document.getElementById('file-picker');picker.onchange=e=>{addFiles(e.target.files);e.target.value=''};
document.getElementById('paste-zone').onclick=()=>picker.click();
document.getElementById('content').addEventListener('paste',e=>{const it=e.clipboardData&&e.clipboardData.items;if(!it)return;const fs=[...it].filter(x=>x.type&&x.type.startsWith('image/')).map(x=>x.getAsFile());if(fs.length){e.preventDefault();addFiles(fs)}});
document.getElementById('list').addEventListener('click',e=>{if(e.target.matches('.shots img')){document.getElementById('lightbox-img').src=e.target.src;document.getElementById('lightbox').classList.add('show')}});
document.getElementById('lightbox').onclick=()=>document.getElementById('lightbox').classList.remove('show');
document.getElementById('filter').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.v;document.querySelectorAll('#filter button').forEach(x=>x.classList.toggle('on',x===b));render()};
document.getElementById('list').addEventListener('change',async e=>{if(e.target.dataset.act!=='status')return;const id=e.target.closest('.item').dataset.id;try{await call('PATCH',`${API}/${id}`,{status:e.target.value});await load()}catch(err){alert(err.message)}});
document.getElementById('list').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const item=b.closest('.item');const id=item.dataset.id;const x=all.find(v=>String(v.id)===id);
if(b.dataset.act==='cadd'){if(cposting)return;const ta=item.querySelector('[data-f="ccontent"]'),au=item.querySelector('[data-f="cauthor"]').value.trim();if(!ta.value.trim())return;
  cposting=true;b.disabled=true;b.textContent='등록 중…';try{try{localStorage.setItem('sug-author',au)}catch(_){}await call('POST',`${API}/${id}/comments`,{author:au,content:ta.value});await load()}catch(err){alert(err.message)}finally{cposting=false}return}
if(b.dataset.act==='cdel'){if(!confirm('이 답글을 지울까요?'))return;try{await call('DELETE',`${API}/${id}/comments/${b.dataset.cid}`);await load()}catch(err){alert(err.message)}return}
if(b.dataset.act==='del'){if(!confirm('이 건의를 삭제할까요?'))return;try{await call('DELETE',`${API}/${id}`);await load()}catch(err){alert(err.message)}}
if(b.dataset.act==='reply'){if(item.querySelector('.edit'))return;const d=document.createElement('div');d.className='edit';d.innerHTML='<textarea maxlength="2000" aria-label="답변"></textarea><div class="row"><button data-act="save">저장</button><button class="ghost" data-act="cancel">취소</button></div>';d.querySelector('textarea').value=x.reply||'';item.append(d);d.querySelector('textarea').focus()}
if(b.dataset.act==='cancel')item.querySelector('.edit').remove();
if(b.dataset.act==='save'){try{await call('PATCH',`${API}/${id}`,{reply:item.querySelector('.edit textarea').value});await load()}catch(err){alert(err.message)}}});
load();
</script><script>
// 비밀번호 관리자(Bitwarden 등) 창이 입력칸에서 뜨지 않게 (2026-10-07)
(function(){
  const mark=el=>{ el.setAttribute('data-bwignore','true'); el.setAttribute('data-lpignore','true'); el.setAttribute('data-1p-ignore','true'); el.setAttribute('data-form-type','other'); el.setAttribute('autocomplete','off'); };
  const scan=root=>{ if(root.querySelectorAll) root.querySelectorAll('input,textarea,[contenteditable]').forEach(mark); if(root.matches&&root.matches('input,textarea,[contenteditable]')) mark(root); };
  const go=()=>{ scan(document); new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>n.nodeType===1&&scan(n)))).observe(document.body,{childList:true,subtree:true}); };
  if(document.body) go(); else document.addEventListener('DOMContentLoaded',go);
})();
</script>
<script>/* 사이트 안에 끼워 보일 때 높이를 내용에 맞춤 (2026-10-11) */
(function(){ function fit(){ try{ var f=window.frameElement; if(f) f.style.height=Math.max(500,document.documentElement.scrollHeight+8)+'px'; }catch(e){} }
  window.addEventListener('load',fit); if(window.ResizeObserver) new ResizeObserver(fit).observe(document.body); setInterval(fit,1500); })();</script>
</body></html>
