<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>종목토론</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#d6dee8;font:14px/1.6 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 4px}.sub,.muted{color:#94a3b8}.box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;margin-top:18px}
input,textarea{width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:10px;font:inherit}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus{outline:2px solid #1f6feb;border-color:#1f6feb}
button{background:#1f6feb;color:#fff;border:0;border-radius:7px;padding:9px 16px;cursor:pointer;font:inherit}button.ghost{background:transparent;color:#93c5fd;border:1px solid #30363d;padding:5px 10px;font-size:13px}button.danger{color:#f87171}button.mini{padding:1px 7px;font-size:11px;margin-left:2px}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}.row .grow{flex:1;min-width:120px}
.item{border-top:1px solid #2b3340;padding:14px 0}.item:first-child{border-top:0}.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:#94a3b8}.content{white-space:pre-wrap;margin:6px 0 0;color:#e6edf3}.edited{font-size:11px;color:#8b949e}
.tag{font-size:12px;padding:2px 9px;border-radius:12px;border:1px solid #1f6feb;color:#93c5fd}
.shot{max-width:100%;max-height:480px;border-radius:8px;border:1px solid #30363d;margin-top:8px;display:block;cursor:zoom-in}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}.shots img{width:100%;height:150px;object-fit:cover;border-radius:8px;border:1px solid #30363d;cursor:zoom-in;display:block}
.c-shots{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.c-shots img{width:90px;height:90px;object-fit:cover;border-radius:6px;border:1px solid #30363d;cursor:zoom-in}
.post-body .content{margin-top:10px}.inline-shot{display:block;max-width:100%;height:auto;margin:12px 0;border-radius:6px;cursor:zoom-in}
.c-shots img.c-full{width:auto;height:auto;max-width:min(320px,100%);max-height:none;object-fit:contain}
.paste-zone{border:1.5px dashed #30363d;border-radius:8px;padding:10px;margin-top:10px;font-size:12.5px;color:#8b949e;text-align:center;cursor:pointer}
.previews{display:flex;flex-wrap:wrap;gap:12px}.preview{position:relative;display:inline-block;margin-top:10px}.preview img{width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid #30363d;display:block}
.previews.small .preview{margin-top:6px}.previews.small .preview img{width:64px;height:64px}.preview .pnum{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(0,0,0,.7);color:#fff;padding:1px 5px;border-radius:4px}
.preview .rm{position:absolute;top:-8px;right:-8px;background:#f85149;color:#fff;border:0;border-radius:50%;width:22px;height:22px;line-height:22px;padding:0;font-size:13px;cursor:pointer}
.empty{text-align:center;color:#94a3b8;padding:24px}.err{color:#f87171;font-size:13px}
.comments{margin-top:10px;padding-left:14px;border-left:2px solid #21262d}
.replies{margin-left:22px;border-left:2px solid #21262d;padding-left:10px}.replies .comment .meta:before{content:'↳ ';color:#6e7681}
.reply-form{margin:4px 0 6px 22px}.reply-form .comment-form{margin-top:4px}
.comment{padding:6px 0;font-size:13px}.comment .meta{font-size:11px;margin-bottom:2px}.comment .content{margin:0;font-size:13px}
.comment-form{margin-top:10px}.cf-top{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.cf-hint{font-size:11.5px;color:#6e7681}
.comment-form textarea{min-height:76px;font-size:14px;line-height:1.5;resize:vertical}.cf-btns{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.comment-form button{padding:7px 14px;font-size:13px}.comment-form .cam{background:transparent;border:1px solid #30363d;padding:6px 10px}.editor textarea{min-height:110px}
.editor{margin-top:8px;padding:10px;border:1px solid #30363d;border-radius:8px;background:#0f141b}.editor textarea{min-height:70px}.rich{min-height:220px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;outline:none;cursor:text}.rich:focus{border-color:#1f6feb;outline:2px solid #1f6feb}.rich:empty:before{content:attr(data-ph);color:#6e7681}.rich img{display:block;max-width:100%;height:auto;margin:8px 0;border-radius:6px;border:2px solid transparent;cursor:pointer}.rich img.sel{border-color:#f85149}.editor .rich{min-height:320px}
.board{width:100%;border-collapse:collapse}.board td{padding:10px 8px;border-top:1px solid #21262d;vertical-align:middle}.board tr:first-child td{border-top:0}
.board tr.post{cursor:pointer}.board tr.post:hover{background:#1c2330}.board .b-tag{width:110px;color:#93c5fd;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.board .b-title{color:#e6edf3}.board .b-cnt{color:#58a6ff;font-weight:600;font-size:12.5px;margin-left:5px}.board .b-img{font-size:12px;margin-left:4px;color:#8b949e}
.board .b-author{width:110px;color:#c9d1d9;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}.board .b-time{width:80px;color:#8b949e;font-size:12.5px;text-align:right;white-space:nowrap}
.who{display:inline-flex;white-space:nowrap;border:1px solid #30363d;border-radius:8px;overflow:hidden}.who button{background:transparent;color:#cbd5e1;border:0;border-radius:0;padding:7px 14px;font-size:13px}.who button.on{background:#1f6feb;color:#fff}
.title-in{font-weight:600}
.post-title{font-size:18px;font-weight:700;color:#e6edf3;margin:6px 0 2px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
@media(max-width:640px){main{padding:14px}.comment-form textarea{font-size:16px}.board .b-tag{display:none}.board .b-author{width:auto;max-width:70px;font-size:12px}.board .b-time{width:auto}}
button.fav{background:none;border:0;color:#8b949e;font-size:17px;cursor:pointer;padding:0 4px;line-height:1}button.fav.on{color:#e3b341}
button.ghost.fav{font-size:13px;padding:6px 10px;border:1px solid #30363d;border-radius:8px}.board .b-fav{width:28px;text-align:center}
#fav-only.on{border-color:#e3b341;color:#e3b341}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.show{display:flex}.lightbox img{max-width:92vw;max-height:92vh;border-radius:6px}
</style></head><body><main>
<h1>종목토론</h1><div class="sub">종목 얘기, 차트 스크린샷 자유롭게 남겨 보세요. 사진은 입력창에 <b>Ctrl+V</b>로 붙여넣거나 골라서 올릴 수 있습니다 (글 최대 20장, 댓글 최대 5장).</div>
<div class="topbar"><button class="ghost" id="back" style="display:none">← 목록</button><span class="muted" id="board-info"></span><button class="ghost" id="fav-only" title="내 이름(작성자 버튼에서 고른 이름)으로 별 표시한 글만">☆ 즐겨찾기만</button><button id="write-btn">✎ 글쓰기</button></div>
<section class="box" id="write-box" style="display:none">
  <div class="row">
    <input id="stock-name" class="grow" maxlength="100" placeholder="종목명 (선택)">
    <input id="stock-code" style="max-width:120px" maxlength="20" placeholder="종목코드 (선택)">
  </div>
  <div style="margin-top:10px"><input id="title" class="title-in" maxlength="100" placeholder="제목 (필수)"></div>
  <div style="margin-top:10px">
    <div id="content" class="rich" contenteditable="true" data-ph="내용을 입력하세요. 스크린샷은 원하는 줄에서 Ctrl+V 하면 그 자리에 바로 들어갑니다 (사진을 누르고 Delete로 빼기)"></div>
  </div>
  <div class="paste-zone" id="paste-zone">여기 눌러서 사진 선택 (여러 장 가능, 최대 20장)</div>
  <div class="row"><span class="muted" style="font-size:13px">작성자</span><span class="who" data-who="post"></span><span class="grow"></span><button id="submit">남기기</button></div>
  <div id="form-msg" class="err" role="status"></div>
</section>
<section class="box" id="list"><div class="empty">불러오는 중…</div></section>
</main>
<input type="file" id="file-picker" accept="image/*" multiple style="display:none">
<div class="lightbox" id="lightbox"><img id="lightbox-img" src="" alt=""></div>
<script>
const API='__API_PREFIX__/discussion';const MAX_POST=20,MAX_COMMENT=5;
const AUTHORS=['우라늄','감사하모니카'];
function getAuthor(){try{const v=localStorage.getItem('disc-author');if(AUTHORS.includes(v))return v}catch(e){}return AUTHORS[0]}
function setAuthor(v){try{localStorage.setItem('disc-author',v)}catch(e){}
  if(typeof loadFavs==='function')loadFavs().then(()=>{   // 이름을 바꾸면 그 이름의 즐겨찾기로 별만 다시 칠함 (입력 중인 글은 그대로)
    document.querySelectorAll('[data-fav]').forEach(b=>{const on=favIds.has(+b.dataset.fav);b.classList.toggle('on',on);b.textContent=on?'★':'☆';b.title=v+' 즐겨찾기'});
    if(!current&&favOnly)renderBoard()})}
// .who 칸에 두 이름 토글 버튼을 그린다. 고른 이름은 data-value에 둔다.
function whoToggle(el){
  const v=getAuthor();el.dataset.value=v;
  el.innerHTML=AUTHORS.map(a=>`<button type="button" class="${a===v?'on':''}" data-name="${a}">${a}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button[data-name]');if(!b)return;
    el.dataset.value=b.dataset.name;setAuthor(b.dataset.name);
    el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('.who').forEach(o=>{if(o!==el){o.dataset.value=b.dataset.name;o.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.name===b.dataset.name))}})};
}
let all=[],current=null;   // all: 게시판 목록(요약), current: 열어 본 글 전체
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=t=>new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
async function call(method,url,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok){let m='요청에 실패했습니다.';try{m=(await r.json()).detail||m}catch(e){}throw Error(typeof m==='string'?m:'입력값을 확인해 주세요.')}return r.json()}

// 큰 이미지는 canvas로 줄여서 저장 (최대 가로 1280px, JPEG 80%)
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(),reader=new FileReader();
    reader.onload=()=>{img.onload=()=>{
      const scale=Math.min(1,1280/img.width),w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.8));
    };img.onerror=reject;img.src=reader.result};
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}

// 글 칸은 내용 길이만큼 늘어난다 (스크롤 없이 전체를 보며 [사진N] 자리를 잡게)
function autoGrow(t){if(!t)return;t.style.height='auto';t.style.height=(t.scrollHeight+4)+'px'}
document.addEventListener('input',e=>{if(e.target.matches('.comment-form textarea,.editor textarea'))autoGrow(e.target)});

// 글 본문 편집기: 사진이 글 사이에 그대로 보이는 칸 (2026-10-05 "수정도 사진이 본문에 들어가 있으면 좋겠다").
// 저장할 때는 사진 자리를 [사진N]으로 바꿔 글자와 사진 목록으로 보낸다 — 서버·글 보기 형식은 그대로.
function richEditor(el,max,msgEl){
  let saved=null;
  const inEl=n=>n&&(n===el||el.contains(n));
  document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&inEl(s.anchorNode))saved=s.getRangeAt(0).cloneRange()});
  const count=()=>el.querySelectorAll('img').length;
  const mkImg=src=>{const i=document.createElement('img');i.src=src;i.alt='';return i};
  function place(node){
    const s=getSelection();let r=s.rangeCount&&inEl(s.anchorNode)?s.getRangeAt(0):saved;
    if(!r||!inEl(r.startContainer)){el.appendChild(node);r=document.createRange();r.setStartAfter(node)}
    else{r.deleteContents();r.insertNode(node);r=r.cloneRange();r.setStartAfter(node)}
    const nl=document.createTextNode('\n');r.insertNode(nl);r.setStartAfter(nl);r.collapse(true);
    s.removeAllRanges();s.addRange(r);saved=r.cloneRange();
  }
  const ed={el,
    load(text,images){
      el.innerHTML='';images=images||[];const used=new Set();
      const parts=String(text||'').split(/\[사진(\d+)\]\n?/);
      for(let k=0;k<parts.length;k++){
        if(k%2){const i=Number(parts[k])-1;if(images[i]&&!used.has(i)){used.add(i);el.appendChild(mkImg(images[i]));el.appendChild(document.createTextNode('\n'))}continue}
        if(parts[k])el.appendChild(document.createTextNode(parts[k]));
      }
      images.forEach((u,i)=>{if(!used.has(i)){el.appendChild(document.createTextNode('\n'));el.appendChild(mkImg(u))}});
    },
    value(){
      let out='';const imgs=[];
      const walk=n=>{for(const c of n.childNodes){
        if(c.nodeType===3)out+=c.nodeValue.replace(/\u00a0/g,' ');
        else if(c.nodeName==='BR')out+='\n';
        else if(c.nodeName==='IMG'){imgs.push(c.src);if(out&&!out.endsWith('\n'))out+='\n';out+=`[사진${imgs.length}]\n`}
        else if(c.nodeType===1){const blk=/^(DIV|P)$/.test(c.nodeName);if(blk&&out&&!out.endsWith('\n'))out+='\n';walk(c);if(blk&&!out.endsWith('\n'))out+='\n'}
      }};
      walk(el);
      return{content:out.replace(/\n{3,}/g,'\n\n').trim(),images:imgs};
    },
    clear(){el.innerHTML=''},
    async add(files){
      const list=[...files].filter(f=>f&&f.type&&f.type.startsWith('image/'));if(!list.length)return;
      const room=max-count();
      if(room<=0){if(msgEl)msgEl.textContent=`사진은 최대 ${max}장까지입니다.`;return}
      if(msgEl)msgEl.textContent=list.length>room?`사진은 최대 ${max}장까지라 ${room}장만 넣었습니다.`:'';
      for(const f of list.slice(0,room)){try{place(mkImg(await resizeImage(f)))}catch(e){if(msgEl)msgEl.textContent='이미지를 처리하지 못했습니다.'}}
    }};
  el.addEventListener('paste',e=>{
    const cd=e.clipboardData;if(!cd)return;
    const files=[...cd.items].filter(it=>it.type&&it.type.startsWith('image/')).map(it=>it.getAsFile());
    e.preventDefault();
    if(files.length){ed.add(files);return}
    const t=cd.getData('text/plain');if(t)document.execCommand('insertText',false,t);
  });
  el.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files;if(f&&f.length){e.preventDefault();ed.add(f)}});
  // 사진 누르면 선택(빨간 테두리) → Delete/Backspace로 빼기
  el.addEventListener('click',e=>{el.querySelectorAll('img.sel').forEach(i=>i.classList.remove('sel'));if(e.target.tagName==='IMG')e.target.classList.add('sel')});
  el.addEventListener('keydown',e=>{const i=el.querySelector('img.sel');if(i&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();const n=i.nextSibling;if(n&&n.nodeType===3&&n.nodeValue.startsWith('\n'))n.nodeValue=n.nodeValue.slice(1);i.remove()}});
  return ed;
}
// 사진 묶음: 미리보기 영역 + 목록 + 최대 장수. 새 글·댓글 입력·수정 화면이 모두 이걸 쓴다.
function photoSet(area,max,msgEl,initial=[],textEl=null){
  const set={images:[...initial],max,
    render(){area.innerHTML=set.images.map((u,i)=>`<div class="preview"><img src="${u}" alt="">${textEl?`<span class="pnum">사진${i+1}</span>`:''}<button type="button" class="rm" data-i="${i}" title="빼기">✕</button></div>`).join('');
      area.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);set.images.splice(i,1);
        if(textEl)textEl.value=textEl.value.replace(new RegExp(`\\[사진${i+1}\\]\\n?`,'g'),'').replace(/\[사진(\d+)\]/g,(m,n)=>Number(n)>i+1?`[사진${Number(n)-1}]`:m);
        set.render()})},
    mark(n){if(!textEl)return;const t=textEl,a=t.selectionStart??t.value.length,b=t.selectionEnd??a;
      const pre=t.value.slice(0,a),ins=(pre&&!pre.endsWith('\n')?'\n':'')+`[사진${n}]\n`;
      t.value=pre+ins+t.value.slice(b);const c=a+ins.length;try{t.setSelectionRange(c,c)}catch(e){};},
    async add(files){
      const list=[...files].filter(f=>f&&f.type&&f.type.startsWith('image/'));if(!list.length)return;
      const room=max-set.images.length;
      if(room<=0){if(msgEl)msgEl.textContent=`사진은 최대 ${max}장까지입니다.`;return}
      if(msgEl)msgEl.textContent=list.length>room?`사진은 최대 ${max}장까지라 ${room}장만 추가했습니다.`:'';
      for(const f of list.slice(0,room)){try{set.images.push(await resizeImage(f));set.mark(set.images.length)}catch(e){if(msgEl)msgEl.textContent='이미지를 처리하지 못했습니다.'}}
      set.render();
    }};
  set.render();return set;
}
// 파일 선택 창은 하나를 같이 쓴다
let pickTarget=null;
const picker=document.getElementById('file-picker');
picker.onchange=e=>{if(pickTarget)pickTarget.add(e.target.files);e.target.value=''};
function pick(set){pickTarget=set;picker.click()}
function pasteInto(el,set){el.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  const files=[...items].filter(it=>it.type&&it.type.startsWith('image/')).map(it=>it.getAsFile());
  if(files.length){e.preventDefault();set.add(files)}
})}

// 새 글
const formMsg=document.getElementById('form-msg');
const newPost=richEditor(document.getElementById('content'),MAX_POST,formMsg);
document.getElementById('paste-zone').onclick=()=>pick(newPost);
document.getElementById('submit').onclick=async()=>{
  const v=newPost.value(),content=v.content,title=document.getElementById('title').value.trim();
  if(!title){formMsg.textContent='제목을 입력해 주세요.';document.getElementById('title').focus();return}
  if(!content&&!v.images.length){formMsg.textContent='내용이나 이미지를 입력해 주세요.';return}
  try{
    await call('POST',API,{title,content,images:v.images,author:document.querySelector('[data-who="post"]').dataset.value,
      stock_name:document.getElementById('stock-name').value.trim(),stock_code:document.getElementById('stock-code').value.trim()});
    ['title','stock-name','stock-code'].forEach(id=>document.getElementById(id).value='');
    newPost.clear();formMsg.textContent='';
    document.getElementById('write-box').style.display='none';
    if(location.hash)location.hash='';else await route();
  }catch(e){formMsg.textContent=e.message}
};

// 목록
const commentSets={};   // 게시글별 댓글 입력 사진
function shotsHtml(images,small){
  if(!images||!images.length)return'';
  if(small)return`<div class="c-shots">${images.map(u=>`<img class="c-full" src="${u}" data-zoom="1" loading="lazy" alt="">`).join('')}</div>`;
  if(images.length===1)return`<img class="shot" src="${images[0]}" data-zoom="1" alt="">`;
  return`<div class="shots">${images.map(u=>`<img src="${u}" data-zoom="1" loading="lazy" alt="">`).join('')}</div>`;
}
// 즐겨찾기: 작성자 버튼에서 고른 이름별로 서버에 저장 (2026-10-06)
let favIds=new Set(),favOnly=false;
async function loadFavs(){try{const r=await call('GET',`${API}/favs?who=${encodeURIComponent(getAuthor())}`);favIds=new Set(r.ids)}catch(e){}}
async function toggleFav(pid){const on=!favIds.has(pid);try{const r=await call('POST',`${API}/${pid}/fav`,{who:getAuthor(),on});favIds=new Set(r.ids)}catch(err){alert(err.message);return}
  if(current)renderPost();else renderBoard()}
const star=pid=>`<button class="fav${favIds.has(pid)?' on':''}" data-fav="${pid}" title="${getAuthor()} 즐겨찾기">${favIds.has(pid)?'★':'☆'}</button>`;
function renderBoard(){
  const box=document.getElementById('list');
  const fb=document.getElementById('fav-only');fb.textContent=favOnly?`★ 즐겨찾기만 (${getAuthor()})`:'☆ 즐겨찾기만';fb.classList.toggle('on',favOnly);
  const rows=favOnly?all.filter(x=>favIds.has(x.id)):all;
  document.getElementById('board-info').textContent=all.length?(favOnly?`즐겨찾기 ${rows.length}개`:`글 ${all.length}개`):'';
  if(!rows.length){box.innerHTML=`<div class="empty">${favOnly?'즐겨찾기한 글이 없습니다. 글 옆 ☆를 누르면 여기 모입니다.':'아직 글이 없습니다. 첫 글을 남겨 주세요.'}</div>`;return}
  box.innerHTML='<table class="board"><tbody>'+rows.map(x=>`<tr class="post" data-open="${x.id}">
    <td class="b-fav">${star(x.id)}</td>
    <td class="b-tag">${x.stock_name||x.stock_code?esc(x.stock_name||x.stock_code):'자유'}</td>
    <td><span class="b-title">${esc(x.title)}</span>${x.comments?`<span class="b-cnt">${x.comments}</span>`:''}${x.images?`<span class="b-img" title="사진 ${x.images}장">🖼</span>`:''}${x.edited?' <span class="edited">(수정됨)</span>':''}</td>
    <td class="b-author">${x.author?esc(x.author):'익명'}</td>
    <td class="b-time">${shortWhen(x.created_at)}</td></tr>`).join('')+'</tbody></table>';
}
// 오늘 글은 시:분, 그 전은 월.일
function shortWhen(t){
  const d=new Date(t),day=v=>v.toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'});
  if(day(d)===day(new Date()))return d.toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false});
  return d.toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit'}).replace(/\s/g,'').replace(/\.$/,'');
}
// 본문의 [사진N] 자리에 사진을 넣고, 본문에 안 쓴 사진은 글 밑에 차례로 크게 붙인다 (2026-10-05 "펨코 게시판처럼")
function postBody(text,images){
  images=images||[];const used=new Set();let html='';
  const img=i=>`<img class="inline-shot" src="${images[i]}" data-zoom="1" loading="lazy" alt="">`;
  const parts=String(text||'').split(/\[사진(\d+)\]\n?/);
  for(let k=0;k<parts.length;k++){
    if(k%2){const i=Number(parts[k])-1;if(images[i]&&!used.has(i)){used.add(i);html+=img(i)}continue}
    const t=parts[k].replace(/^\n+|\n+$/g,'');if(t)html+=`<p class="content">${esc(t)}</p>`;
  }
  images.forEach((u,i)=>{if(!used.has(i))html+=img(i)});
  return html;
}
// 댓글 + 대댓글(한 단계): 원 댓글 밑에 답글을 들여서 붙인다
function commentHtml(c,isReply){
  return`<div class="comment" data-cid="${c.id}">
      <div class="meta">${c.author?esc(c.author)+' · ':''}${when(c.created_at)}${c.edited?' <span class="edited">(수정됨)</span>':''}
        <button class="ghost mini" data-act="reply">답글</button><button class="ghost mini" data-act="edit-comment">수정</button><button class="ghost danger mini" data-act="del-comment">✕</button></div>
      <div class="body">${c.content?`<p class="content">${esc(c.content)}</p>`:''}${shotsHtml(c.images,true)}</div>
    </div>`;
}
function commentsHtml(list){
  const ids=new Set(list.map(c=>c.id)),kids={};
  list.forEach(c=>{if(c.parent_id&&ids.has(c.parent_id))(kids[c.parent_id]=kids[c.parent_id]||[]).push(c)});
  return list.filter(c=>!(c.parent_id&&ids.has(c.parent_id))).map(c=>`<div class="thread" data-tid="${c.id}">${commentHtml(c,false)}`
    +`${kids[c.id]?`<div class="replies">${kids[c.id].map(r=>commentHtml(r,true)).join('')}</div>`:''}</div>`).join('');
}
// 답글에 다는 답글은 같은 묶음 맨 밑에 '@이름'을 붙여서 이어 쓴다 (펨코처럼 한 단계 들여쓰기 유지)
function openReply(thread,to){
  const old=thread.querySelector('.reply-form textarea');
  if(old){if(to&&!old.value.startsWith('@'))old.value=`@${to} `+old.value;old.focus();return}
  const f=document.createElement('div');f.className='reply-form';
  f.innerHTML=`<div class="comment-form"><div class="cf-top"><span class="who" data-f="r-author"></span><span class="cf-hint">Enter 등록 · Shift+Enter 줄바꿈</span></div>
      <textarea maxlength="1000" placeholder="답글 입력 (사진은 Ctrl+V 또는 📷)" data-f="r-content"></textarea>
      <div class="cf-btns"><button class="cam" data-act="r-photo" title="답글 사진 추가">📷</button><button class="ghost" data-act="r-cancel">취소</button><button data-act="add-reply">등록</button></div></div>
    <div class="previews small" data-f="r-previews"></div>`;
  thread.appendChild(f);
  f._set=photoSet(f.querySelector('[data-f="r-previews"]'),MAX_COMMENT,null);
  pasteInto(f.querySelector('[data-f="r-content"]'),f._set);
  whoToggle(f.querySelector('[data-f="r-author"]'));
  const ta=f.querySelector('textarea');if(to)ta.value=`@${to} `;ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
}
async function addReply(f){
  const thread=f.closest('.thread'),content=f.querySelector('[data-f="r-content"]').value.trim();
  if(!content&&!f._set.images.length)return;
  try{await call('POST',`${API}/${current.id}/comments`,{content,images:f._set.images,parent_id:Number(thread.dataset.tid),
    author:f.querySelector('[data-f="r-author"]').dataset.value});await load()}catch(err){alert(err.message)}
}
function renderPost(){const box=document.getElementById('list');const x=current;
box.innerHTML=`<div class="item" data-id="${x.id}">
  ${x.title?`<div class="post-title">${esc(x.title)}</div>`:''}
  <div class="meta">${x.stock_name||x.stock_code?`<span class="tag">${esc(x.stock_name||'')}${x.stock_code?' ('+esc(x.stock_code)+')':''}</span>`:''}<span>${x.author?esc(x.author)+' · ':''}${when(x.created_at)}</span>${x.edited?'<span class="edited">(수정됨)</span>':''}</div>
  <div class="body post-body">${postBody(x.content,x.images)}</div>
  <div class="row">${star(x.id).replace('class="fav','class="ghost fav')}<button class="ghost" data-act="edit">수정</button><button class="ghost danger" data-act="del">삭제</button></div>
  <div class="comments">
    ${commentsHtml(x.comments||[])}
    <div class="comment-form">
      <div class="cf-top"><span class="who" data-f="c-author"></span><span class="cf-hint">Enter 등록 · Shift+Enter 줄바꿈</span></div>
      <textarea maxlength="1000" placeholder="댓글 입력 (사진은 Ctrl+V 또는 📷)" data-f="c-content"></textarea>
      <div class="cf-btns"><button class="cam" data-act="c-photo" title="댓글 사진 추가">📷</button><button data-act="add-comment">등록</button></div>
    </div>
    <div class="previews small" data-f="c-previews"></div>
  </div>
</div>`;
  const item=box.querySelector('.item');
  const set=photoSet(item.querySelector('[data-f="c-previews"]'),MAX_COMMENT,null);
  commentSets[x.id]=set;
  pasteInto(item.querySelector('[data-f="c-content"]'),set);
  whoToggle(item.querySelector('[data-f="c-author"]'));
}

// 수정 화면 (글·댓글 공용): 본문 자리에 편집기를 띄운다
function openEditor(host,{text,images,max,stock,onSave}){
  if(host.querySelector('.editor'))return;
  const body=host.querySelector(':scope > .body');body.style.display='none';
  const ed=document.createElement('div');ed.className='editor';
  ed.innerHTML=`${stock?`<input class="title-in" data-e="title" maxlength="100" placeholder="제목 (필수)" style="margin-bottom:8px">`:''}${stock?`<div class="row" style="margin-top:0"><input class="grow" data-e="sname" maxlength="100" placeholder="종목명"><input style="max-width:120px" data-e="scode" maxlength="20" placeholder="종목코드"></div>`:''}
    ${stock?`<div data-e="rich" class="rich" contenteditable="true" style="margin-top:8px" data-ph="내용 (사진은 원하는 줄에서 Ctrl+V)"></div>`:`<textarea data-e="text" maxlength="1000"></textarea>
    <div class="previews small" data-e="previews"></div>`}
    <div class="row"><button class="ghost" data-e="add">사진 추가</button><button data-e="save">저장</button><button class="ghost" data-e="cancel">취소</button><span class="err" data-e="msg"></span></div>`;
  body.after(ed);
  const q=k=>ed.querySelector(`[data-e="${k}"]`);
  let set,rich;
  if(stock){q('sname').value=stock.name||'';q('scode').value=stock.code||'';q('title').value=stock.title||'';
    rich=richEditor(q('rich'),max,q('msg'));rich.load(text,images)}
  else{q('text').value=text||'';set=photoSet(q('previews'),max,q('msg'),images||[]);pasteInto(q('text'),set)}
  q('add').onclick=()=>pick(rich||set);
  q('cancel').onclick=()=>{ed.remove();body.style.display=''};
  q('save').onclick=async()=>{
    const payload=rich?rich.value():{content:q('text').value.trim(),images:set.images};
    if(stock){payload.stock_name=q('sname').value.trim();payload.stock_code=q('scode').value.trim();payload.title=q('title').value.trim();
      if(!payload.title){q('msg').textContent='제목을 입력해 주세요.';return}}
    if(!payload.content&&!payload.images.length){q('msg').textContent='내용이나 사진을 남겨 주세요.';return}
    try{await onSave(payload);await load()}catch(err){q('msg').textContent=err.message}
  };
  (rich?rich.el:q('text')).focus();
}

// 이 페이지는 메인 화면의 긴 iframe 안에 있어서, 확대 창은 메인 화면(같은 출처)에 띄워야 보고 있는 화면 가운데에 보인다.
function openLightbox(src){
  let top=null;
  try{if(window.parent!==window&&window.parent.document)top=window.parent.document}catch(e){}
  if(!top){document.getElementById('lightbox-img').src=src;document.getElementById('lightbox').classList.add('show');return}
  let box=top.getElementById('disc-lightbox');
  if(!box){
    box=top.createElement('div');box.id='disc-lightbox';
    box.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:none;align-items:center;justify-content:center;cursor:zoom-out';
    const img=top.createElement('img');img.style.cssText='max-width:92vw;max-height:92vh;border-radius:6px';
    box.appendChild(img);box.onclick=()=>{box.style.display='none'};
    top.addEventListener('keydown',e=>{if(e.key==='Escape')box.style.display='none'});
    top.body.appendChild(box);
  }
  box.firstChild.src=src;box.style.display='flex';
}
document.getElementById('lightbox').onclick=()=>document.getElementById('lightbox').classList.remove('show');

async function route(){
  const m=location.hash.match(/^#(\d+)$/);
  document.getElementById('back').style.display=m?'':'none';
  document.getElementById('write-btn').style.display=m?'none':'';
  document.getElementById('board-info').style.display=m?'none':'';
  if(m)document.getElementById('write-box').style.display='none';
  const box=document.getElementById('list');
  try{
    await loadFavs();
    document.getElementById('fav-only').style.display=m?'none':'';
    if(m){current=await call('GET',`${API}/${m[1]}`);renderPost()}
    else{current=null;all=await call('GET',`${API}/board`);renderBoard()}
  }catch(e){box.innerHTML=`<div class="empty">${m?'글을 불러오지 못했습니다.':'목록을 불러오지 못했습니다.'}</div>`}
  // 메인 화면의 iframe 안이라, 글을 열면 iframe 맨 위가 보이게 올린다
  try{if(window.frameElement)window.frameElement.scrollIntoView({block:'start'});else window.scrollTo(0,0)}catch(e){}
}
const load=route;   // 저장·삭제 뒤 지금 화면을 다시 불러온다
window.addEventListener('hashchange',route);
document.getElementById('back').onclick=()=>{location.hash=''};
document.getElementById('write-btn').onclick=()=>{const w=document.getElementById('write-box');w.style.display=w.style.display==='none'?'':'none';if(w.style.display==='')document.getElementById('content').focus()};
async function addComment(item){
  const contentEl=item.querySelector('[data-f="c-content"]'),set=commentSets[item.dataset.id];
  const content=contentEl.value.trim();
  if(!content&&!set.images.length)return;
  try{await call('POST',`${API}/${item.dataset.id}/comments`,{content,images:set.images,author:item.querySelector('[data-f="c-author"]').dataset.value});await load()}
  catch(err){alert(err.message)}
}
document.getElementById('fav-only').onclick=async()=>{favOnly=!favOnly;await loadFavs();if(!current)renderBoard()};
document.getElementById('list').addEventListener('click',async e=>{
  const fv=e.target.closest('[data-fav]');if(fv){e.stopPropagation();toggleFav(+fv.dataset.fav);return}
  if(e.target.matches('img[data-zoom]')){openLightbox(e.target.src);return}
  const row=e.target.closest('tr[data-open]');if(row){location.hash=row.dataset.open;return}
  const b=e.target.closest('button');if(!b||!b.dataset.act)return;
  const item=b.closest('.item');const post=current;
  const act=b.dataset.act;
  if(act==='del'){if(!confirm('이 글을 삭제할까요?'))return;try{await call('DELETE',`${API}/${post.id}`);location.hash=''}catch(err){alert(err.message)}}
  if(act==='edit')openEditor(item,{text:post.content,images:post.images,max:MAX_POST,stock:{name:post.stock_name,code:post.stock_code,title:post.title},
    onSave:p=>call('PATCH',`${API}/${post.id}`,p)});
  if(act==='reply'){const cm=b.closest('.comment'),c=post.comments.find(v=>String(v.id)===cm.dataset.cid);
    openReply(b.closest('.thread'),cm.closest('.replies')&&c&&c.author?c.author:'');return}
  if(act==='add-reply'){addReply(b.closest('.reply-form'));return}
  if(act==='r-photo'){pick(b.closest('.reply-form')._set);return}
  if(act==='r-cancel'){b.closest('.reply-form').remove();return}
  if(act==='add-comment')addComment(item);
  if(act==='c-photo')pick(commentSets[item.dataset.id]);
  if(act==='del-comment'||act==='edit-comment'){
    const el=b.closest('.comment');const c=post.comments.find(v=>String(v.id)===el.dataset.cid);
    if(act==='del-comment'){if(!confirm(post.comments.some(v=>v.parent_id===c.id)?'이 댓글과 달린 답글을 모두 삭제할까요?':'이 댓글을 삭제할까요?'))return;try{await call('DELETE',`${API}/comments/${c.id}`);await load()}catch(err){alert(err.message)}}
    else openEditor(el,{text:c.content,images:c.images,max:MAX_COMMENT,onSave:p=>call('PATCH',`${API}/comments/${c.id}`,p)});
  }
});
document.getElementById('list').addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  if(e.target.matches('[data-f="c-content"]')){e.preventDefault();addComment(e.target.closest('.item'))}
  if(e.target.matches('[data-f="r-content"]')){e.preventDefault();addReply(e.target.closest('.reply-form'))}
});
whoToggle(document.querySelector('[data-who="post"]'));
route();
</script></body></html>
