<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>종목토론</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#d6dee8;font:14px/1.6 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 4px}.sub,.muted{color:#94a3b8}.box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;margin-top:18px}
input,textarea{width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:10px;font:inherit}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus{outline:2px solid #1f6feb;border-color:#1f6feb}
button{background:#1f6feb;color:#fff;border:0;border-radius:7px;padding:9px 16px;cursor:pointer;font:inherit}button.ghost{background:transparent;color:#93c5fd;border:1px solid #30363d;padding:5px 10px;font-size:13px}button.danger{color:#f87171}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}.row .grow{flex:1;min-width:120px}
.item{border-top:1px solid #2b3340;padding:14px 0}.item:first-child{border-top:0}.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:#94a3b8}.content{white-space:pre-wrap;margin:6px 0 0;color:#e6edf3}
.tag{font-size:12px;padding:2px 9px;border-radius:12px;border:1px solid #1f6feb;color:#93c5fd}
.shot{max-width:100%;max-height:480px;border-radius:8px;border:1px solid #30363d;margin-top:8px;display:block;cursor:zoom-in}
.paste-zone{border:1.5px dashed #30363d;border-radius:8px;padding:10px;margin-top:10px;font-size:12.5px;color:#8b949e;text-align:center}
.preview{position:relative;display:inline-block;margin-top:10px}.preview img{max-width:260px;max-height:200px;border-radius:8px;border:1px solid #30363d;display:block}
.preview .rm{position:absolute;top:-8px;right:-8px;background:#f85149;color:#fff;border:0;border-radius:50%;width:22px;height:22px;line-height:22px;padding:0;font-size:13px;cursor:pointer}
.empty{text-align:center;color:#94a3b8;padding:24px}.err{color:#f87171;font-size:13px}
.comments{margin-top:10px;padding-left:14px;border-left:2px solid #21262d}
.comment{padding:6px 0;font-size:13px}.comment .meta{font-size:11px;margin-bottom:2px}.comment .content{margin:0;font-size:13px}
.comment-form{display:flex;gap:6px;margin-top:8px}.comment-form input{flex:1}.comment-form input.name{flex:0 0 90px}.comment-form button{padding:7px 12px;font-size:13px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.show{display:flex}.lightbox img{max-width:92vw;max-height:92vh;border-radius:6px}
</style></head><body><main>
<h1>종목토론</h1><div class="sub">종목 얘기, 차트 스크린샷 자유롭게 붙여넣어 보세요. 이미지는 복사한 상태에서 입력창에 <b>Ctrl+V</b>로 붙여넣으면 됩니다.</div>
<section class="box">
  <div class="row">
    <input id="stock-name" class="grow" maxlength="100" placeholder="종목명 (선택)">
    <input id="stock-code" style="max-width:120px" maxlength="20" placeholder="종목코드 (선택)">
  </div>
  <div style="margin-top:10px">
    <textarea id="content" maxlength="2000" placeholder="내용을 입력하거나, 스크린샷을 복사해서 여기에 Ctrl+V로 붙여넣으세요"></textarea>
  </div>
  <div class="paste-zone" id="paste-zone">여기 눌러서 이미지 선택도 가능 (클릭)</div>
  <input type="file" id="file-input" accept="image/*" style="display:none">
  <div id="preview-area"></div>
  <div class="row"><input id="author" class="grow" maxlength="40" placeholder="이름 (선택)"><button id="submit">남기기</button></div>
  <div id="form-msg" class="err" role="status"></div>
</section>
<section class="box" id="list"><div class="empty">불러오는 중…</div></section>
</main>
<div class="lightbox" id="lightbox"><img id="lightbox-img" src=""></div>
<script>
const API='__API_PREFIX__/discussion';let all=[],pendingImage=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=t=>new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
async function call(method,url,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok){let m='요청에 실패했습니다.';try{m=(await r.json()).detail||m}catch(e){}throw Error(typeof m==='string'?m:'입력값을 확인해 주세요.')}return r.json()}

// 큰 이미지는 canvas로 리사이즈/압축해서 DB 부담을 줄임 (최대 가로 1280px, JPEG 80%)
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=()=>{img.onload=()=>{
      const maxW=1280;const scale=Math.min(1,maxW/img.width);
      const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.8));
    };img.onerror=reject;img.src=reader.result};
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}
function showPreview(dataUrl){
  pendingImage=dataUrl;
  document.getElementById('preview-area').innerHTML=`<div class="preview"><img src="${dataUrl}"><button class="rm" id="rm-preview" title="제거">✕</button></div>`;
  document.getElementById('rm-preview').onclick=()=>{pendingImage=null;document.getElementById('preview-area').innerHTML=''};
}
async function handleFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  try{showPreview(await resizeImage(file))}catch(e){document.getElementById('form-msg').textContent='이미지를 처리하지 못했습니다.'}
}
document.getElementById('content').addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(const item of items){if(item.type&&item.type.startsWith('image/')){handleFile(item.getAsFile());e.preventDefault();break}}
});
document.getElementById('paste-zone').onclick=()=>document.getElementById('file-input').click();
document.getElementById('file-input').onchange=e=>handleFile(e.target.files[0]);

function render(){const box=document.getElementById('list');
if(!all.length){box.innerHTML='<div class="empty">아직 글이 없습니다. 첫 글을 남겨 주세요.</div>';return}
box.innerHTML=all.map(x=>`<div class="item" data-id="${x.id}">
  <div class="meta">${x.stock_name||x.stock_code?`<span class="tag">${esc(x.stock_name||'')}${x.stock_code?' ('+esc(x.stock_code)+')':''}</span>`:''}<span>${x.author?esc(x.author)+' · ':''}${when(x.created_at)}</span></div>
  ${x.content?`<p class="content">${esc(x.content)}</p>`:''}
  ${x.image_data?`<img class="shot" src="${x.image_data}" onclick="openLightbox('${x.image_data}')">`:''}
  <div class="row"><button class="ghost danger" data-act="del">삭제</button></div>
  <div class="comments">
    ${(x.comments||[]).map(c=>`<div class="comment" data-cid="${c.id}">
      <div class="meta">${c.author?esc(c.author)+' · ':''}${when(c.created_at)} <button class="ghost danger" data-act="del-comment" style="padding:1px 6px;font-size:11px;margin-left:4px">✕</button></div>
      <p class="content">${esc(c.content)}</p>
    </div>`).join('')}
    <div class="comment-form">
      <input class="name" maxlength="40" placeholder="이름" data-f="c-author">
      <input maxlength="1000" placeholder="댓글을 입력하세요" data-f="c-content">
      <button data-act="add-comment">등록</button>
    </div>
  </div>
</div>`).join('')}
function openLightbox(src){document.getElementById('lightbox-img').src=src;document.getElementById('lightbox').classList.add('show')}
document.getElementById('lightbox').onclick=()=>document.getElementById('lightbox').classList.remove('show');

async function load(){try{all=await call('GET',API);render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">목록을 불러오지 못했습니다.</div>'}}
document.getElementById('submit').onclick=async()=>{
  const msg=document.getElementById('form-msg');
  const content=document.getElementById('content').value.trim();
  if(!content&&!pendingImage){msg.textContent='내용이나 이미지를 입력해 주세요.';return}
  try{
    await call('POST',API,{
      content, image_data: pendingImage,
      author: document.getElementById('author').value.trim(),
      stock_name: document.getElementById('stock-name').value.trim(),
      stock_code: document.getElementById('stock-code').value.trim(),
    });
    document.getElementById('content').value='';
    document.getElementById('stock-name').value='';
    document.getElementById('stock-code').value='';
    document.getElementById('preview-area').innerHTML='';pendingImage=null;
    msg.textContent='';await load();
  }catch(e){msg.textContent=e.message}
};
async function addComment(itemEl){
  const postId=itemEl.dataset.id;
  const authorEl=itemEl.querySelector('[data-f="c-author"]');
  const contentEl=itemEl.querySelector('[data-f="c-content"]');
  const content=contentEl.value.trim();
  if(!content)return;
  try{
    await call('POST',`${API}/${postId}/comments`,{content,author:authorEl.value.trim()});
    await load();
  }catch(err){alert(err.message)}
}
document.getElementById('list').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const item=b.closest('.item');
  if(b.dataset.act==='del'){
    if(!confirm('이 글을 삭제할까요?'))return;
    try{await call('DELETE',`${API}/${item.dataset.id}`);await load()}catch(err){alert(err.message)}
  }
  if(b.dataset.act==='add-comment')addComment(item);
  if(b.dataset.act==='del-comment'){
    const cid=b.closest('.comment').dataset.cid;
    if(!confirm('이 댓글을 삭제할까요?'))return;
    try{await call('DELETE',`${API}/comments/${cid}`);await load()}catch(err){alert(err.message)}
  }
});
document.getElementById('list').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('[data-f="c-content"]')){e.preventDefault();addComment(e.target.closest('.item'))}
});
load();
</script></body></html>
